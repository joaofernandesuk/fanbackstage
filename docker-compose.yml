services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fanbackstage
      POSTGRES_USER: fanbackstage
      POSTGRES_PASSWORD: fanbackstage
    ports: ["${FANBACKSTAGE_POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanbackstage -d fanbackstage"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["${FANBACKSTAGE_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    ports: ["${FANBACKSTAGE_MAILPIT_UI_PORT:-8025}:8025", "${FANBACKSTAGE_SMTP_PORT:-1025}:1025"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fanbackstage
      MINIO_ROOT_PASSWORD: fanbackstage-development-only
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://127.0.0.1:31000,http://127.0.0.1:38181
    ports: ["${FANBACKSTAGE_MINIO_PORT:-9000}:9000", "${FANBACKSTAGE_MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro]
    restart: unless-stopped
volumes:
  postgres_data:
  minio_data:
