name: FanBackstage CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: fanbackstage, POSTGRES_USER: fanbackstage, POSTGRES_PASSWORD: fanbackstage }
        ports: ["5432:5432"]
        options: >- 
          --health-cmd "pg_isready -U fanbackstage -d fanbackstage" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025"]
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install FFmpeg with bounded repository retries
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          timeout 180s sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          timeout 180s sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run alembic upgrade head
      - name: Verify Phase 2 migration reversibility
        run: uv run alembic downgrade 20260819_0002 && uv run alembic upgrade head
      - run: FANBACKSTAGE_ENVIRONMENT=test FANBACKSTAGE_DATABASE_URL=postgresql+asyncpg://fanbackstage:fanbackstage@localhost:5432/fanbackstage FANBACKSTAGE_REDIS_URL=redis://localhost:6379/1 uv run pytest
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: docker compose up -d
      - run: cd apps/api && uv sync --all-groups
      - run: cd apps/web && pnpm install --no-frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: cd apps/web && E2E_MAILPIT_URL=http://127.0.0.1:8025 pnpm test:e2e
