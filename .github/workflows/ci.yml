name: FanBackstage CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env: { POSTGRES_DB: fanbackstage, POSTGRES_USER: fanbackstage, POSTGRES_PASSWORD: fanbackstage }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fanbackstage -d fanbackstage" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4.5-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports: ["1025:1025"]
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v4
      - name: Install FFmpeg with bounded repository retries
        run: |
          timeout 180s sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          timeout 180s sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check app tests
      - name: Empty database to current migration head
        run: uv run alembic upgrade head
      - name: Current compliance/outbox downgrade and re-upgrade
        run: uv run alembic downgrade 20260826_0036 && uv run alembic upgrade head
      - name: Full backend suite
        run: FANBACKSTAGE_ENVIRONMENT=test FANBACKSTAGE_DATABASE_URL=postgresql+asyncpg://fanbackstage:fanbackstage@localhost:5432/fanbackstage FANBACKSTAGE_REDIS_URL=redis://localhost:6379/1 uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  runtime-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release-SHA API/worker image
        run: docker build --tag fanbackstage-api:${GITHUB_SHA} apps/api
      - name: Prove worker media runtime
        run: docker run --rm fanbackstage-api:${GITHUB_SHA} sh -c 'ffmpeg -version >/dev/null && ffprobe -version >/dev/null && celery --version'
      - name: Build release-SHA web image
        run: >-
          docker build --tag fanbackstage-web:${GITHUB_SHA}
          --build-arg FANBACKSTAGE_ENVIRONMENT=staging
          --build-arg NEXT_PUBLIC_FANBACKSTAGE_API_URL=https://api.staging.invalid
          --build-arg NEXT_PUBLIC_FANBACKSTAGE_ENVIRONMENT=staging
          --build-arg NEXT_PUBLIC_FANBACKSTAGE_ERROR_TRACKING_PROVIDER=sentry
          --build-arg NEXT_PUBLIC_FANBACKSTAGE_ERROR_TRACKING_DSN=https://public-key@errors.staging.invalid/1
          --build-arg NEXT_PUBLIC_FANBACKSTAGE_RELEASE_SHA=${GITHUB_SHA}
          --build-arg NEXT_PUBLIC_FANBACKSTAGE_WEB_ORIGIN=https://staging.invalid
          apps/web

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env: { POSTGRES_DB: fanbackstage_e2e, POSTGRES_USER: fanbackstage_e2e, POSTGRES_PASSWORD: fanbackstage_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fanbackstage_e2e -d fanbackstage_e2e" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4.5-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports: ["1025:1025", "8025:8025"]
    env:
      FANBACKSTAGE_E2E_ISOLATED: "1"
      FANBACKSTAGE_ENVIRONMENT: test
      FANBACKSTAGE_DATABASE_URL: postgresql+asyncpg://fanbackstage_e2e:fanbackstage_e2e@127.0.0.1:5432/fanbackstage_e2e
      FANBACKSTAGE_REDIS_URL: redis://127.0.0.1:6379/1
      FANBACKSTAGE_SMTP_HOST: 127.0.0.1
      FANBACKSTAGE_SMTP_PORT: "1025"
      E2E_MAILPIT_URL: http://127.0.0.1:8025
      E2E_STORAGE_ENDPOINT_URL: http://127.0.0.1:19010
      FANBACKSTAGE_STORAGE_ENDPOINT_URL: http://127.0.0.1:19010
      FANBACKSTAGE_STORAGE_PUBLIC_ENDPOINT_URL: http://127.0.0.1:19010
      FANBACKSTAGE_STORAGE_ACCESS_KEY: fanbackstage-e2e
      FANBACKSTAGE_STORAGE_SECRET_KEY: fanbackstage-e2e-storage-secret
      E2E_LIVEKIT_IMAGE: livekit/livekit-server:v1.13.5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - name: Install browser/media dependencies
        run: |
          timeout 180s sudo apt-get update -o Acquire::Retries=3
          timeout 180s sudo apt-get install -y --no-install-recommends ffmpeg
          cd apps/api && uv sync --all-groups --frozen
          cd ../web && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Start isolated object storage
        run: >-
          docker run -d --rm --name fanbackstage-ci-e2e-minio
          -p 127.0.0.1:19010:9000
          -e MINIO_ROOT_USER=fanbackstage-e2e
          -e MINIO_ROOT_PASSWORD=fanbackstage-e2e-storage-secret
          -e MINIO_API_CORS_ALLOW_ORIGIN=http://127.0.0.1:38181
          minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - name: Wait for isolated object storage
        run: |
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:19010/minio/health/live && exit 0; sleep 0.25; done
          docker logs fanbackstage-ci-e2e-minio
          exit 1
      - name: Run isolated browser journeys with persisted result
        shell: bash
        run: |
          set +e
          cd apps/web
          pnpm test:e2e 2>&1 | tee ../../playwright-e2e.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../../playwright-e2e.status
          exit "$status"
      - name: Remove isolated object storage
        if: always()
        run: docker rm -f fanbackstage-ci-e2e-minio >/dev/null 2>&1 || true
      - name: Upload Playwright result and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_attempt }}
          path: |
            playwright-e2e.log
            playwright-e2e.status
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14
